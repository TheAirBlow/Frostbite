# One host, any number of daemons: turn on the ones you want with profiles.
#   docker compose --profile xray up -d
#   docker compose --profile xray --profile singbox up -d
# Tokens come from the panel (Nodes -> Add daemon) and go in .env next to this file.

x-agent: &agent
  restart: unless-stopped
  network_mode: host
  cap_add:
    - NET_ADMIN
  environment: &agent-env
    FROSTBITE_PANEL_URL: ${FROSTBITE_PANEL_URL:?FROSTBITE_PANEL_URL must be set}
    FROSTBITE_INSECURE: ${FROSTBITE_INSECURE:-false}

services:
  xray:
    <<: *agent
    profiles: [xray]
    image: ${FROSTBITE_IMAGE_XRAY:-ghcr.io/theairblow/frostbite-agent-xray:latest}
    environment:
      <<: *agent-env
      FROSTBITE_TOKEN: ${FROSTBITE_XRAY_TOKEN:-}
    volumes:
      - ./data/xray:/data
      - ./certs:/certs
      # For "Use Caddy's certificate": Caddy's data folder, the one holding certificates/ (/data/caddy in Caddy's image).
      # - /var/lib/caddy/.local/share/caddy:/caddy:ro

  singbox:
    <<: *agent
    profiles: [singbox]
    image: ${FROSTBITE_IMAGE_SINGBOX:-ghcr.io/theairblow/frostbite-agent-singbox:latest}
    environment:
      <<: *agent-env
      FROSTBITE_TOKEN: ${FROSTBITE_SINGBOX_TOKEN:-}
    volumes:
      - ./data/singbox:/data
      - ./certs:/certs
      # - /var/lib/caddy/.local/share/caddy:/caddy:ro

  # Shares port 443 between the other daemons on this host by looking at the TLS server name.
  edge:
    <<: *agent
    profiles: [edge]
    image: ${FROSTBITE_IMAGE_EDGE:-ghcr.io/theairblow/frostbite-agent-edge:latest}
    environment:
      <<: *agent-env
      FROSTBITE_TOKEN: ${FROSTBITE_EDGE_TOKEN:-}
    volumes:
      - ./data/edge:/data

  # A Telegram proxy with one secret per user.
  mtproto:
    <<: *agent
    profiles: [mtproto]
    image: ${FROSTBITE_IMAGE_MTPROTO:-ghcr.io/theairblow/frostbite-agent-mtproto:latest}
    environment:
      <<: *agent-env
      FROSTBITE_TOKEN: ${FROSTBITE_MTPROTO_TOKEN:-}
    volumes:
      - ./data/mtproto:/data

  # Tunnels that hide inside a call on a platform such as VK.
  turnable:
    <<: *agent
    profiles: [turnable]
    image: ${FROSTBITE_IMAGE_TURNABLE:-ghcr.io/theairblow/frostbite-agent-turnable:latest}
    environment:
      <<: *agent-env
      FROSTBITE_TOKEN: ${FROSTBITE_TURNABLE_TOKEN:-}
    volumes:
      - ./data/turnable:/data

  # NaiveProxy that doubles as the front of a real website: everyone who is not a proxy user is sent on to it.
  caddy:
    <<: *agent
    profiles: [caddy]
    image: ${FROSTBITE_IMAGE_CADDY:-ghcr.io/theairblow/frostbite-agent-caddy:latest}
    environment:
      <<: *agent-env
      FROSTBITE_TOKEN: ${FROSTBITE_CADDY_TOKEN:-}
    volumes:
      - ./data/caddy:/data
      - ./certs:/certs
      # For "Use Caddy's certificate": Caddy's data folder, the one holding certificates/ (/data/caddy in Caddy's image).
      # - /var/lib/caddy/.local/share/caddy:/caddy:ro
