name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: panel, file: Dockerfile, target: "", context: . }
          - { name: web, file: frontend/Dockerfile, target: "", context: frontend }
          - { name: agent-xray, file: Dockerfile.agent, target: xray, context: . }
          - { name: agent-singbox, file: Dockerfile.agent, target: singbox, context: . }
          - { name: agent-edge, file: Dockerfile.agent, target: edge, context: . }
          - { name: agent-mtproto, file: Dockerfile.agent, target: mtproto, context: . }
          - { name: agent-turnable, file: Dockerfile.agent, target: turnable, context: . }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/frostbite-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
