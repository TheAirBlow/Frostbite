global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # the panel serves these on their own port, which docker-compose.yml never publishes
  - job_name: frostbite
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["panel:9091"]

  # the machine the panel runs on; nodes report their own health through their daemons
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
